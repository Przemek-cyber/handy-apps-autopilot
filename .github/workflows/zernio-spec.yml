name: Pomocnicze — specyfikacja Zernio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz i wytnij fragment o komentarzach
        run: |
          mkdir -p tools
          curl -sSL --compressed https://zernio.com/openapi.json -o /tmp/spec.json
          head -c 200 /tmp/spec.json | tr -d '\n' | sed 's/^/::notice title=Początek pliku::/'; echo
          python3 -c "import json;json.load(open('/tmp/spec.json'))" 2>/dev/null || curl -sSL --compressed https://docs.zernio.com/api/openapi -o /tmp/spec.json
          python3 - <<'PY'
          import json
          spec = json.load(open("/tmp/spec.json"))
          comps = spec.get("components", {}).get("schemas", {})
          def resolve(o, depth=0):
              if depth > 6: return o
              if isinstance(o, dict):
                  if "$ref" in o:
                      name = o["$ref"].split("/")[-1]
                      return {"$ref": name, **resolve(comps.get(name, {}), depth + 1)}
                  return {k: resolve(v, depth + 1) for k, v in o.items()}
              if isinstance(o, list): return [resolve(x, depth + 1) for x in o]
              return o
          out = {"servers": spec.get("servers"), "paths": {}}
          for path, ops in spec.get("paths", {}).items():
              if "comment-automation" in path or "automation" in path.lower():
                  out["paths"][path] = resolve(ops)
          json.dump(out, open("tools/zernio-comment-automations.json", "w"), indent=1)
          print(list(out["paths"]))
          tk = {k: v for k, v in comps.items() if "tiktok" in k.lower()}
          def find(o, path=""):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if "tiktok" in k.lower(): tk[path + "/" + k] = v
                      find(v, path + "/" + k)
              elif isinstance(o, list):
                  for i, x in enumerate(o): find(x, path + f"[{i}]")
          find(spec.get("paths", {}).get("/v1/posts", spec.get("paths", {}).get("/posts", {})), "posts")
          json.dump(tk, open("tools/zernio-tiktok.json", "w"), indent=1)
          print("tiktok:", list(tk)[:40])
          PY
      - run: |
          git config user.name "handy-apps-bot"
          git config user.email "handy-apps-bot@users.noreply.github.com"
          git add tools/
          git commit -q -m "Specyfikacja Zernio" && git push -q
