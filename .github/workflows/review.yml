name: Kontrola posta (komentarz)

# Twój komentarz pod zgłoszeniem posta: "ok" = bez zmian, każdy inny = wstrzymanie posta.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency: review

jobs:
  review:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'autopost') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests

      - name: Reakcja na komentarz
        id: rev
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: python src/review.py

      - name: Odpowiedź i zapis
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body-file reply.md
          if [ "${{ steps.rev.outputs.action }}" = "cancelled" ]; then
            git config user.name "handy-apps-bot"
            git config user.email "handy-apps-bot@users.noreply.github.com"
            git add posts/*/cancelled.json
            git commit -q -m "Wstrzymano post (zgłoszenie #$NUM)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
            gh label create wstrzymany --color 888888 --force
            gh issue edit "$NUM" --add-label wstrzymany
            gh issue close "$NUM" --reason "not planned"
          fi
