name: Generuj posty

# Pon i czw ok. 18:00 czasu polskiego (cron w UTC): agenci przygotowują posty na wt / pt,
# planują je w Zernio i zakładają zgłoszenia do Twojej kontroli (gotowe przed 20:00).
on:
  schedule:
    - cron: "47 15 * * 1,4"
  workflow_dispatch:
    inputs:
      app:
        description: "Apka (ready72h / bikepackpilot); puste = obie"
        required: false
      format:
        description: "auto / carousel / reel"
        required: false
        default: auto
      date:
        description: "Data publikacji RRRR-MM-DD; puste = jutro"
        required: false

permissions:
  contents: write
  issues: write

concurrency: generate

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Zależności
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generuj i zaplanuj
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ secrets.ZERNIO_ACCOUNT_ID }}
          IN_APP: ${{ inputs.app }}
          IN_FORMAT: ${{ inputs.format }}
          IN_DATE: ${{ inputs.date }}
        run: |
          ARGS=""
          [ -n "$IN_APP" ] && ARGS="$ARGS --app $IN_APP"
          [ -n "$IN_FORMAT" ] && ARGS="$ARGS --format $IN_FORMAT"
          [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
          python src/generate.py $ARGS

      - name: Zapisz posty w repo
        if: always() && steps.gen.outputs.created != ''
        run: |
          git config user.name "handy-apps-bot"
          git config user.email "handy-apps-bot@users.noreply.github.com"
          for NAME in ${{ steps.gen.outputs.created }}; do git add "posts/$NAME"; git reset -q -- "posts/$NAME/issue_body.md"; done
          git commit -q -m "Posty do publikacji: ${{ steps.gen.outputs.created }}"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: Zgłoszenia do kontroli
        if: always() && steps.gen.outputs.created != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create autopost --color E4572E --description "Post zaplanowany przez agentów" --force
          for NAME in ${{ steps.gen.outputs.created }}; do
            gh issue create --title "📣 $NAME" --label autopost --assignee "${{ github.repository_owner }}" \
              --body-file "posts/$NAME/issue_body.md"
          done
