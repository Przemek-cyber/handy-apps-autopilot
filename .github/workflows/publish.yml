name: Narzędzia publikacji (ręcznie)

# Zwykła publikacja działa sama (Generuj posty → Zernio). Tu: test połączenia albo awaryjna publikacja od razu.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "Tylko test połączenia z Instagramem (nic nie publikuje)"
        type: boolean
        default: true
      action:
        description: "Inne: automations (utwórz automaty komentarz → DM) / automation-logs (podgląd zdarzeń)"
        required: false
      reschedule:
        description: "Zaplanuj ponownie wszystkie zaplanowane posty (np. po ponownym połączeniu Instagrama)"
        type: boolean
        default: false
      retime:
        description: "Przy ponownym planowaniu ustaw godziny wg publish_times z harmonogramu"
        type: boolean
        default: false
      post:
        description: "Folder z posts/ do natychmiastowej publikacji (np. 2026-10-13-ready72h); puste = nic"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Uruchom
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ secrets.ZERNIO_ACCOUNT_ID }}
          IN_POST: ${{ inputs.post }}
          RETIME: ${{ inputs.retime && '1' || '' }}
        run: |
          if [ -n "${{ inputs.action }}" ]; then python src/publish.py --${{ inputs.action }};
          elif [ "${{ inputs.reschedule }}" = "true" ]; then python src/publish.py --reschedule;
          elif [ -n "$IN_POST" ]; then python src/publish.py --post "$IN_POST"; else python src/publish.py --check; fi
      - name: Zapisz status i zamknij zgłoszenia
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          IN_POST: ${{ inputs.post }}
        run: |
          git config user.name "handy-apps-bot"
          git config user.email "handy-apps-bot@users.noreply.github.com"
          git add -A posts
          git diff --cached --quiet || (git commit -q -m "Opublikowano od razu: $IN_POST" && git pull -q --rebase origin main && git push -q origin HEAD:main)
          [ -f published_now.txt ] || exit 0
          while IFS=$'\t' read -r OLD NEW LINK; do
            NUM=$(gh issue list --label autopost --state open --search "$OLD in:title" --json number --jq '.[0].number')
            [ -n "$NUM" ] && gh issue comment "$NUM" --body "✅ Opublikowano od razu (poza harmonogramem): $LINK" && gh issue close "$NUM"
          done < published_now.txt
        shell: bash
