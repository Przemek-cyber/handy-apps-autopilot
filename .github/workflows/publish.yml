name: Narzędzia publikacji (ręcznie)

# Zwykła publikacja działa sama (Generuj posty → Zernio). Tu: test połączenia albo awaryjna publikacja od razu.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "Tylko test połączenia z Instagramem (nic nie publikuje)"
        type: boolean
        default: true
      post:
        description: "Folder z posts/ do natychmiastowej publikacji (np. 2026-10-13-ready72h); puste = nic"
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml requests
      - name: Uruchom
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNT_ID: ${{ secrets.ZERNIO_ACCOUNT_ID }}
          IN_POST: ${{ inputs.post }}
        run: |
          if [ -n "$IN_POST" ]; then python src/publish.py --post "$IN_POST"; else python src/publish.py --check; fi
      - name: Zapisz status
        if: always()
        run: |
          git config user.name "handy-apps-bot"
          git config user.email "handy-apps-bot@users.noreply.github.com"
          git add posts/*/published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Opublikowano post (ręcznie)" && git push -q)
