<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: BrandSerif; font-weight: 700; src: url("{{font_serif_bold}}"); }
  @font-face { font-family: BrandSans; font-weight: 400; src: url("{{font_sans}}"); }
  @font-face { font-family: BrandSans; font-weight: 700; src: url("{{font_sans_bold}}"); }
  @font-face { font-family: BrandMono; font-weight: 400; src: url("{{font_mono}}"); }
  :root {
    --bg1: {{bg1}}; --bg2: {{bg2}}; --panel: {{panel}}; --text: {{text}}; --muted: {{muted}}; --accent: {{accent}};
    --headline: {{headline_family}};
    --w: {{w}}px; --h: {{h}}px; --u: {{unit}}px;   /* u = 1/100 szerokości kadru */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: transparent; }
  body { font-family: BrandSans, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; position: relative; }

  /* tło + dekoracje; .holed wycina okno telefonu (przezroczyste), w które ffmpeg wstawia nagranie */
  .bg { position: absolute; inset: 0; background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%); }
  .bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bg.holed { -webkit-mask: url("{{hole_mask}}") 0 0 / 100% 100% no-repeat; mask: url("{{hole_mask}}") 0 0 / 100% 100% no-repeat; }

  .layer { position: absolute; inset: 0; }
  .header { position: absolute; left: 0; right: 0; top: calc(var(--u) * {{header_top}}); display: flex; justify-content: center; align-items: center; gap: calc(var(--u) * 2); }
  .header .word { font-family: BrandSerif; font-weight: 700; font-size: calc(var(--u) * 4.6); letter-spacing: -0.01em; color: var(--text); }
  .header svg { height: calc(var(--u) * 4.4); width: auto; }

  em { font-style: normal; color: var(--accent); }
  .headline { font-family: var(--headline); font-weight: 700; line-height: 1.16; letter-spacing: -0.01em; }

  /* panel tekstowy z pomarańczowym paskiem (jak w rolce Ready72h i banerach BikepackPilot) */
  .panel { position: absolute; background: var(--panel); border-radius: calc(var(--u) * 2.2); overflow: hidden;
           padding: calc(var(--u) * 3.6) calc(var(--u) * 4.4) calc(var(--u) * 3.6) calc(var(--u) * 5);
           display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 1.8); }
  .panel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--u) * 0.75); background: var(--accent); }
  /* rozmiary w panelu w em: data-fit zmniejsza czcionkę panelu i skaluje cały tekst w środku */
  .panel { font-size: calc(var(--u) * 3.3); }
  .panel .headline { font-size: 1.64em; }
  .panel p { font-size: 1em; line-height: 1.38; color: var(--muted); }
  .kicker { font-family: BrandMono; font-size: 0.8em; color: var(--accent); letter-spacing: 0.08em; }

  /* telefon */
  .phone { position: absolute; border-radius: calc(var(--u) * 3.4); overflow: hidden;
           box-shadow: 0 0 0 calc(var(--u) * 0.28) rgba(255,255,255,.16), 0 calc(var(--u) * 3) calc(var(--u) * 8) rgba(0,0,0,.45); }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }

  /* okładka / hak */
  .hero { position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: calc(var(--u) * 3.4); }
  .hero .headline { font-size: calc(var(--u) * {{hero_size}}); }
  .hero p { font-size: calc(var(--u) * 3.6); line-height: 1.4; color: var(--muted); max-width: 92%; }

  /* karta końcowa */
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 9); }
  .end svg { height: calc(var(--u) * 14); width: auto; margin-bottom: calc(var(--u) * 1.5); }
  .end .name { font-family: BrandSerif; font-weight: 700; font-size: calc(var(--u) * 9.6); line-height: 1; }
  .end .line { font-size: calc(var(--u) * 3.6); line-height: 1.4; color: var(--muted); }
  .end .line.big { font-family: var(--headline); font-weight: 700; color: var(--text); font-size: calc(var(--u) * 4.6); line-height: 1.25; }
  .pill { margin-top: calc(var(--u) * 1.5); background: var(--accent); color: #141414; font-weight: 700; font-size: calc(var(--u) * 3.6);
          padding: calc(var(--u) * 1.7) calc(var(--u) * 5); border-radius: 999px; }

  .foot { position: absolute; left: calc(var(--u) * 6.5); right: calc(var(--u) * 6.5); bottom: calc(var(--u) * 5); display: flex; justify-content: space-between; align-items: center;
          font-size: calc(var(--u) * 2.7); color: var(--muted); }
  .foot .swipe { font-weight: 700; color: var(--accent); }
  .foot .count { font-family: BrandMono; }
</style>
</head>
<body>
{{content}}
<script>
  // dopasowanie wielkości tekstu: zmniejsza czcionkę, dopóki element mieści się w swoim limicie wysokości
  window.__ready = false;
  document.fonts.ready.then(() => {
    document.querySelectorAll('[data-fit]').forEach(el => {
      const max = parseFloat(el.dataset.fit);
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.getBoundingClientRect().height > max && size > 12) { size -= 2; el.style.fontSize = size + 'px'; }
    });
    window.__ready = true;
  });
</script>
</body>
</html>
