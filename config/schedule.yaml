# Harmonogram Handy Apps
#
# Pon i czw (ok. 18:00) agenci przygotowują posty na kolejne dni (codziennie 1 post, apki na zmianę) i planują je w Zernio.
# Do 20:00 dostajesz zgłoszenia (GitHub Issues) z podglądem. Brak komentarza = post wychodzi.
# Komentarz pod zgłoszeniem (inny niż "ok") = post zostaje wstrzymany (usunięty z kolejki Zernio).
#
# Dni generowania ustawia cron w .github/workflows/generate.yml (pon i czw).
timezone: Europe/Warsaw
publish_after_days: 1          # (tryb ręczny) domyślna data publikacji = jutro
# Publikacja CODZIENNA, apki na zmianę (parzysty / nieparzysty dzień). Generowanie w paczkach:
# poniedziałek przygotowuje wt–czw, czwartek przygotowuje pt–pon (posty z wyprzedzeniem do Twojej kontroli).
generate_plan:
  mon: [1, 2, 3]
  thu: [1, 2, 3, 4]
daily_apps: [ready72h, bikepackpilot]   # KAŻDEGO dnia post każdej z tych apek (każda na swojej platformie)
platforms:                     # od 19.10: Instagram = tylko Ready72h, TikTok = tylko BikepackPilot
  ready72h: instagram
  bikepackpilot: tiktok
publish_times:                 # godzina publikacji dla każdej apki (czas polski)
  bikepackpilot: "07:00"       # TikTok
  ready72h: "07:00"            # Instagram
# Test otwarć (hook): agent dostaje styl po kolei, raport tygodniowy porównuje zasięg wg stylu.
hook_favorite: pov            # najlepszy styl otwarcia — używany w co drugim poście
hook_styles:
  question: "Open with a direct, specific question the viewer can't answer instantly (e.g. 'How long would your home last without power?')."
  number: "Open with one surprising, accurate number or fact stated in under 8 words (e.g. '6 litres. Per person. Minimum.'). Only use numbers supported by the approved facts or general official guidance."
  pov: "Open with a 'POV:' line that puts the viewer inside a relatable moment (e.g. 'POV: the lights go out and your phone is at 12%')."
  myth: "Open by stating a common belief and flipping it (e.g. 'You don't need a bunker. You need a list.')."
review_deadline: "20:00"       # do tej godziny posty mają być gotowe do Twojej kontroli
formats: [carousel, reel]      # agent wybiera format sam; nigdy 3 razy z rzędu ten sam
approve_words: [ok, go, "👍", tak, akcept]   # komentarz z tym słowem NIE wstrzymuje posta
