# Fakty o produktach. Agenci mogą twierdzić TYLKO to, co tu jest — kontrola jakości odrzuca resztę.
ready72h:
  name: Ready72h
  one_liner: Be ready for the first 72 hours of any crisis — before help arrives.
  audience: Households and families in apartments or houses who want a calm, practical plan.
  facts:
    - Practical household preparedness planner for the first 72 hours of a crisis (power outage, flood, network blackout).
    - Based on official guidance from Sweden's MSB, Germany's BBK and Poland's RCB.
    - Includes a complete 72-hour supply checklist (water, food, medicine, cash, communications).
    - Includes a family communication plan for when phones and internet go down.
    - Includes a "15 minutes to leave the house" evacuation bag checklist.
    - Two editions - apartment, and house with garden.
    - Printable PDF planner plus a free companion web app that installs to the home screen and works fully offline.
    - The web app has an interactive checklist that tracks progress.
    - Available in Polish, English, German and Spanish.
    - Pay what you want, starting at 2 PLN; suggested price 59 PLN; even the minimum unlocks the full planner and app.
    - The creator's stance - this is a safety topic, not a place to profit off people's anxiety.
    - Includes a section for people with disabilities, wheelchair users and older adults (lighter go-bag, wheelchair repair and power kit, support network) – based on Canadian Red Cross and Christopher & Dana Reeve Foundation guidance.
    - The website ready72h.com has free emergency water and cash calculators and free preparedness guides (English and Polish).
  sources:
    - "MSB (Sweden) — 'In case of crisis or war' guidance"
    - "BBK (Germany) — emergency preparedness guide"
    - "RCB (Poland) — Rządowe Centrum Bezpieczeństwa guidance"
  cta: "Get the planner — link in bio (pay what you want, from 2 PLN)."
  dm_keyword: PLAN       # słowo-klucz: komentarz → DM z linkiem
  dm_enabled: true       # automat komentarz → DM działa w Zernio (src/publish.py --automations)
  link: "https://przemek.lemonsqueezy.com/checkout/buy/4ebf56da-3b44-4d2f-9928-e9aaaa581d5b"
  site_line: "Free water & cash calculators → ready72h.com"   # na końcu filmu (od 28.10)
  site_caption: "Free calculators and guides: ready72h.com"
  dm_message: "Here's your Ready72h planner (pay what you want, from 2 PLN): {link} — PDF + offline app, based on MSB, BBK and RCB guidance. Stay calm and ready 🧡"

bikepackpilot:
  name: BikepackPilot
  one_liner: A comprehensive framework to optimize your bikepacking adventures.
  audience: Bikepackers and touring cyclists planning self-supported trips.
  facts:   # z filmu demo bikepackpilot-demo-en.mp4
    - A comprehensive framework to optimize bikepacking adventures; plan a self-supported bikepacking route in minutes.
    - Enter your real route distance from a map or GPX file.
    - The route splits automatically into 50 km segments.
    - Set surface, heat, wind and rain for each segment.
    - It calculates realistic riding days, not just kilometres.
    - Gear recommendations adapt to the conditions you entered (e.g. hot conditions, rough surface).
    - Find water, food, bike repair and lodging nearby.
    - One-tap location check-in for peace of mind; your data stays on your device.
    - Available in English, Polish, German and Spanish.
    - Web app at bikepackpilot.com that works offline and installs like an app.
    - The website bikepackpilot.com/routes has free route plans with maps for famous routes (e.g. Tour Divide, EuroVelo 6 and 9, Green Velo, Hebridean Way, Camino Francés).
    # TODO: cena i forma zakupu — bez tego agent nie wspomina o cenie
  sources: []
  # od 19.10 BikepackPilot publikujemy na TikToku: brak automatu DM i klikalnego linku → adres strony
  cta: "Plan your next trip at bikepackpilot.com (link in bio)."
  end_pill: "bikepackpilot.com"
  site_line: "Free route plans with maps on the site"          # na końcu filmu (od 28.10)
  site_caption: "Free route plans with maps (Tour Divide, EuroVelo, Green Velo…): bikepackpilot.com/routes"
  dm_keyword: ROUTE      # automat na Instagramie zostaje (stare posty), ale treści go nie obiecują
  dm_enabled: false
  link: "https://przemek.lemonsqueezy.com/checkout/buy/0c0586a4-a00a-45ca-9407-99d445aee50e"
  dm_message: "Here's BikepackPilot: {link} — split your route into 50 km segments, get realistic riding days and a gear list that fits the conditions. Ride relaxed 🚲"
