# Styl wizualny przeniesiony z filmów Ready72h-instagram-reel.mp4 i bikepackpilot-demo-en.mp4.
# Reszta kodu czyta tylko ten plik — tu zmieniasz kolory i czcionki.
name: Handy Apps
handle: "@handyapps"   # TODO: Twój login na IG

fonts:                 # pliki w assets/fonts
  serif_bold: DejaVuSerif-Bold.ttf     # nagłówki Ready72h, nazwy apek
  sans: DejaVuSans.ttf                 # teksty pomocnicze
  sans_bold: DejaVuSans-Bold.ttf       # nagłówki BikepackPilot, przycisk "Link in bio"
  mono: DejaVuSansMono.ttf             # liczby i etykiety (styl BikepackPilot)

apps_style:
  ready72h:
    logo: tent72h                      # trójkąt teal/pomarańcz z napisem 72h
    background: ["#0c1515", "#154c48"] # gradient od lewego górnego do prawego dolnego rogu
    decor: true                        # fala u góry i koncentryczne okręgi w rogu
    panel: "#0e1b1c"                   # panel z tekstem
    text: "#fcf6ed"                    # kremowy tekst
    muted: "#c9d3cf"
    accent: "#c86e2b"                  # pomarańcz: wyróżnienia, pasek panelu, przycisk
    headline_font: serif_bold
    tagline: "Based on official 72-hour guidance from Sweden, Germany & Poland"
  bikepackpilot:
    logo: mountain                     # pomarańczowa linia gór
    background: ["#111813", "#1b2a22"]
    decor: false
    panel: "#141e18"
    text: "#f2f4ef"
    muted: "#a9b3aa"
    accent: "#c87522"
    headline_font: sans_bold
    tagline: "Plan a self-supported bikepacking route in minutes"

voice:
  language: English
  tone: >
    Calm, practical, no-nonsense. Friendly expert, light humour where it fits.
    Never fear-mongering, never clickbait about disasters. Short sentences.
